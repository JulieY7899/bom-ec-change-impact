name: Verify synthetic examples

on:
  push:
    branches: [main, 'codex/**', 'portfolio/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.11'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: ubuntu-latest
            python-version: '3.14'
          - os: macos-latest
            python-version: '3.14'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Reject private runtime files from the tracked tree
        run: python scripts/check_public_files.py
      - name: Run business and local HTTP regressions
        run: python scripts/verify.py
      - name: Check synthetic portfolio scenario
        run: python scripts/run_example.py --check
      - name: Check browser JavaScript syntax
        run: node --check src/bom_change_assistant/web_assets/app.js
      - name: Check quantity labels and values in both views
        run: node scripts/check_frontend_metrics.cjs
